[project]
name = "job-radar"
version = "0.2.0"
description = "Daily LLM job-matching agent with a pytest evaluation suite"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "requests>=2.31",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-radar = "job_radar.__main__:main"

[project.urls]
Homepage = "https://oscar-leung.github.io/job-radar/"
Source = "https://github.com/oscar-leung/job-radar"

[tool.pytest.ini_options]
testpaths = ["evals"]
markers = [
  "live: calls the real Claude API (costs credits; needs ANTHROPIC_API_KEY)",
]
addopts = "-m 'not live'"

[tool.setuptools.packages.find]
where = ["src"]
