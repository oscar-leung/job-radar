name: Application kits, prep packs + cover-note sweep
# Weekly (Sun) small run for new matches + manual. Drafts go to Notion for review; nothing is ever sent or submitted.
on:
  schedule:
    - cron: "17 16 * * 0"   # Sundays ~9 AM Pacific: kits + prep for the week's new matches, capped low
  workflow_dispatch:
    inputs:
      kits_limit:
        description: "How many top Radar matches get a kit (0 = skip kits)"
        default: "15"
      min_score:
        description: "Only matches at or above this Radar score"
        default: "50"
      effort:
        description: "Model effort for kits/prep: low | medium | high | xhigh | max"
        default: "medium"
      revise:
        description: "Fix judge-flagged claims, then re-judge"
        type: boolean
        default: true
      redo:
        description: "Regenerate kits for rows that already have one"
        type: boolean
        default: false
      label:
        description: "Label for regenerated kits, e.g. v2"
        default: ""
      prep_limit:
        description: "How many top matches get an interview prep pack (0 = skip)"
        default: "15"
      max_usd:
        description: "Spend cap per step (USD)"
        default: "2.50"
      run_sweep:
        description: "Also draft cover notes for the rest of the tracker backlog"
        type: boolean
        default: false
      write_notion:
        description: "Write results to Notion (off = artifacts only, for a test)"
        type: boolean
        default: true

jobs:
  kits:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      RESUME_MD: ${{ secrets.RESUME_MD }}
      SCHED: ${{ github.event_name == 'schedule' }}
      WN: ${{ (github.event_name == 'schedule' || inputs.write_notion) && '--write-notion' || '' }}
      KL: ${{ inputs.kits_limit || '15' }}
      PL: ${{ inputs.prep_limit || '15' }}
      MIN: ${{ inputs.min_score || '50' }}
      EFF: ${{ inputs.effort || 'medium' }}
      USD: ${{ inputs.max_usd || '2.50' }}
      REV: ${{ (github.event_name == 'schedule' || inputs.revise) && '--revise' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Application kits
        if: ${{ env.KL != '0' }}
        run: >
          python -m job_radar kits $WN
          --limit $KL --min-score $MIN
          --max-usd $USD --effort $EFF
          $REV ${{ inputs.redo && '--redo' || '' }}
          ${{ inputs.label != '' && format('--label {0}', inputs.label) || '' }}
      - name: Interview prep packs
        if: ${{ always() && env.PL != '0' }}
        run: >
          python -m job_radar prep $WN
          --limit $PL --min-score $MIN
          --effort $EFF --max-usd $USD
      - name: Cover-note sweep (rest of backlog)
        if: ${{ always() && inputs.run_sweep }}
        run: python -m job_radar sweep $WN --limit 150
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kits-prep-notes
          path: |
            reports/
            costs.csv
          retention-days: 30
