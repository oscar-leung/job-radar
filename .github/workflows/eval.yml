name: Live eval
# Manual only — this spends API credits. Run after changing prompts or models.
on:
  workflow_dispatch:
    inputs:
      compare:
        description: "Also run the 4-model Batch comparison + faithfulness judge"
        type: boolean
        default: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RESUME_MD: ${{ secrets.RESUME_MD }}
      LABELS_JSONL: ${{ secrets.LABELS_JSONL }}
      REQUIRED: ANTHROPIC_API_KEY RESUME_MD LABELS_JSONL
    steps:
      - name: Check secrets are set
        run: |
          missing=""
          for v in ${{ env.REQUIRED }}; do [ -z "${!v}" ] && missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing repo secrets:$missing — add them at Settings > Secrets and variables > Actions"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Restore labels (kept out of the public repo)
        run: printf '%s' "$LABELS_JSONL" > evals/labels.jsonl
      - run: pytest -m live -v -s evals/test_live_eval.py
      - if: ${{ always() && inputs.compare }}
        run: python evals/compare_models.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-results, path: evals/results/ }
